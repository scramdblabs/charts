{{- if and (include "scramdb.metricsTokenEnabled" .) (not .Values.metrics.bearerToken.existingSecret) }}
{{/*
The token every metrics request must carry. Mounted into the pod as a file the server
reads at startup, and referenced by the ServiceMonitor so Prometheus sends it.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "scramdb.metricsTokenSecretName" . }}
  namespace: {{ include "scramdb.namespace" . }}
  labels:
    {{- include "scramdb.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
data:
  {{ .Values.metrics.bearerToken.secretKey }}: {{ include "scramdb.metricsToken" . | b64enc | quote }}
{{- end }}
