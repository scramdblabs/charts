{{- if include "scramdb.createAuthSecret" . }}
{{/*
The bootstrap superuser's credential.

Generated once on first install and read back from the live Secret on every
upgrade, so a `helm upgrade` never rotates a working password. Applied by the
engine only while the superuser has no credential at all: a redeployed pod or a
rotated Secret can never reset a password set with ALTER ROLE.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "scramdb.authSecretName" . }}
  namespace: {{ include "scramdb.namespace" . }}
  labels:
    {{- include "scramdb.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
data:
  {{ .Values.auth.secretKeys.passwordKey }}: {{ include "scramdb.authPassword" . | b64enc | quote }}
{{- end }}
