{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "scramdb.fullname" . }}
  namespace: {{ include "scramdb.namespace" . }}
  labels:
    {{- include "scramdb.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  podSelector:
    matchLabels:
      {{- include "scramdb.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  egress:
    {{- if .Values.networkPolicy.allowExternalEgress }}
    - {}
    {{- else }}
    # DNS, without which discovery cannot resolve a single peer.
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # The cluster transport between this chart's own pods: control, interactive and
    # bulk traffic.
    - ports:
        - port: 7190
          protocol: TCP
        - port: 7191
          protocol: TCP
        - port: 7192
          protocol: TCP
      to:
        - podSelector:
            matchLabels:
              {{- include "scramdb.selectorLabels" . | nindent 14 }}
    {{- with .Values.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- end }}
  ingress:
    # Peer to peer traffic on the cluster transport is always restricted to this
    # chart's own pods, whatever allowExternal says: nothing else has business
    # speaking the cluster protocol.
    - ports:
        - port: 7190
          protocol: TCP
        - port: 7191
          protocol: TCP
        - port: 7192
          protocol: TCP
      from:
        - podSelector:
            matchLabels:
              {{- include "scramdb.selectorLabels" . | nindent 14 }}
    {{- if .Values.networkPolicy.allowExternal }}
    - ports:
        - port: 5432
          protocol: TCP
        {{- if .Values.mcp.enabled }}
        - port: {{ .Values.mcp.containerPort }}
          protocol: TCP
        {{- end }}
        {{- if .Values.metrics.enabled }}
        - port: {{ .Values.metrics.containerPort }}
          protocol: TCP
        {{- end }}
    {{- else }}
    - ports:
        - port: 5432
          protocol: TCP
        {{- if .Values.mcp.enabled }}
        - port: {{ .Values.mcp.containerPort }}
          protocol: TCP
        {{- end }}
      from:
        - podSelector:
            matchLabels:
              {{- include "scramdb.selectorLabels" . | nindent 14 }}
        {{- with .Values.networkPolicy.ingressPodMatchLabels }}
        - podSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
        {{- end }}
        {{- with .Values.networkPolicy.ingressNSMatchLabels }}
        - namespaceSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
          {{- with $.Values.networkPolicy.ingressNSPodMatchLabels }}
          podSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
          {{- end }}
        {{- end }}
    {{- if .Values.metrics.enabled }}
    - ports:
        - port: {{ .Values.metrics.containerPort }}
          protocol: TCP
      from:
        - podSelector: {}
        {{- with .Values.networkPolicy.metricsNSMatchLabels }}
        - namespaceSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
        {{- end }}
    {{- end }}
    {{- end }}
    {{- with .Values.networkPolicy.extraIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
