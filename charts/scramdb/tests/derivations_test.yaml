suite: derived cluster values
templates:
  - configmap.yaml
  - statefulset.yaml
  - statefulset-learner.yaml
tests:
  - it: standalone writes no cluster section and one replica
    set:
      architecture: standalone
    asserts:
      - notMatchRegex:
          path: data["config.toml"]
          pattern: "\\[cluster\\]"
        template: configmap.yaml
      - equal:
          path: spec.replicas
          value: 1
        template: statefulset.yaml

  - it: three voters derive bootstrap_expect 2 and hybrid nodes
    set:
      architecture: cluster
      replicaCount: 3
      license:
        key: test
    template: configmap.yaml
    asserts:
      - matchRegex:
          path: data["config.toml"]
          pattern: "bootstrap_expect = 2"
      - matchRegex:
          path: data["config.toml"]
          pattern: "columnar_replica = true"

  - it: five voters derive bootstrap_expect 4 and no hybrid nodes
    set:
      architecture: cluster
      replicaCount: 5
      license:
        key: test
    template: configmap.yaml
    asserts:
      - matchRegex:
          path: data["config.toml"]
          pattern: "bootstrap_expect = 4"
      - matchRegex:
          path: data["config.toml"]
          pattern: "columnar_replica = false"

  - it: region pools sum into one bootstrap_expect
    set:
      architecture: cluster
      license:
        key: test
      regions:
        - name: eu
          replicas: 2
        - name: us
          replicas: 2
    template: configmap.yaml
    asserts:
      - matchRegex:
          path: data["config.toml"]
          pattern: "bootstrap_expect = 3"

  - it: an explicit bootstrap_expect wins over the derivation
    set:
      architecture: cluster
      replicaCount: 3
      cluster:
        bootstrapExpect: 0
      license:
        key: test
    template: configmap.yaml
    asserts:
      - matchRegex:
          path: data["config.toml"]
          pattern: "bootstrap_expect = 0"

  - it: an explicit columnarReplica wins over the derivation
    set:
      architecture: cluster
      replicaCount: 3
      cluster:
        columnarReplica: false
      license:
        key: test
    template: configmap.yaml
    asserts:
      - matchRegex:
          path: data["config.toml"]
          pattern: "columnar_replica = false"

  - it: every pool shares one headless service so they form one cluster
    set:
      architecture: cluster
      license:
        key: test
      regions:
        - name: eu
          replicas: 2
        - name: us
          replicas: 2
    template: statefulset.yaml
    asserts:
      - equal:
          path: spec.serviceName
          value: RELEASE-NAME-scramdb-headless
        documentIndex: 0
      - equal:
          path: spec.serviceName
          value: RELEASE-NAME-scramdb-headless
        documentIndex: 1

  - it: the learner tier is non voting
    set:
      architecture: cluster
      license:
        key: test
      learners:
        enabled: true
        replicas: 2
    asserts:
      - matchRegex:
          path: data["learner-config.toml"]
          pattern: "learner = true"
        template: configmap.yaml
      - equal:
          path: spec.replicas
          value: 2
        template: statefulset-learner.yaml
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: learner
        template: statefulset-learner.yaml

  - it: every node listens for interactive and bulk traffic on its own ports
    set:
      architecture: cluster
      replicaCount: 3
      license:
        key: test
    asserts:
      - matchRegex:
          path: data["config.toml"]
          pattern: 'cluster_interactive_listen = "0\.0\.0\.0:7191"'
        template: configmap.yaml
      - matchRegex:
          path: data["config.toml"]
          pattern: 'cluster_bulk_listen = "0\.0\.0\.0:7192"'
        template: configmap.yaml
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: interactive
            containerPort: 7191
            protocol: TCP
        template: statefulset.yaml
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: bulk
            containerPort: 7192
            protocol: TCP
        template: statefulset.yaml

  - it: fragments run on any covering replica unless cluster.fragmentAnyReplica pins the owners
    set:
      architecture: cluster
      replicaCount: 3
      license:
        key: test
    template: configmap.yaml
    asserts:
      - matchRegex:
          path: data["config.toml"]
          pattern: 'fragment_any_replica = true'

  - it: cluster.fragmentAnyReplica false keeps fragments on the buckets' owners
    set:
      architecture: cluster
      replicaCount: 3
      license:
        key: test
      cluster:
        fragmentAnyReplica: false
    template: configmap.yaml
    asserts:
      - matchRegex:
          path: data["config.toml"]
          pattern: 'fragment_any_replica = false'

  - it: the shared raft log and COPY stage keys pass through cluster.extraToml
    set:
      architecture: cluster
      replicaCount: 3
      license:
        key: test
      cluster:
        extraToml: |
          [cluster.consensus]
          log_segment_size = "128MB"
          [cluster.dilith]
          copy_stage_idle_timeout = "20s"
    template: configmap.yaml
    asserts:
      - matchRegex:
          path: data["config.toml"]
          pattern: '\[cluster\.consensus\]\nlog_segment_size = "128MB"'
      - matchRegex:
          path: data["config.toml"]
          pattern: '\[cluster\.dilith\]\ncopy_stage_idle_timeout = "20s"'

  - it: the cluster sub-tables the chart does not model pass through cluster.extraToml
    set:
      architecture: cluster
      replicaCount: 3
      license:
        key: test
      cluster:
        extraToml: |
          [cluster.dilith]
          recovery_timeout = "1s"
          [cluster.apply]
          reserve_io_cores = false
          [cluster.consensus]
          threads = 4
    template: configmap.yaml
    asserts:
      - matchRegex:
          path: data["config.toml"]
          pattern: '\[cluster\.dilith\]\nrecovery_timeout = "1s"'
      - matchRegex:
          path: data["config.toml"]
          pattern: '\[cluster\.apply\]\nreserve_io_cores = false'
      - matchRegex:
          path: data["config.toml"]
          pattern: '\[cluster\.consensus\]\nthreads = 4'

  - it: the WAL archive keeps a week of segments unless walArchive.retention says otherwise
    template: configmap.yaml
    asserts:
      - matchRegex:
          path: data["config.toml"]
          pattern: 'poll_interval = "5s"\nretention = "168h"'
  - it: walArchive.retention sets the archive's retention
    set:
      walArchive:
        retention: 720h
    template: configmap.yaml
    asserts:
      - matchRegex:
          path: data["config.toml"]
          pattern: 'retention = "720h"'
